[project]
name = "batchgate-backend"
version = "0.1.0"
description = "BatchGate API: AI quality gate for specialty chemical batches"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "arq>=0.28.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-include = ["../evals/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "C90",  # mccabe complexity
    "I",    # import order
    "N",    # pep8 naming
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplifications
    "PIE",  # misc lints
    "RET",  # return statements
    "PT",   # pytest style
    "T20",  # leftover print calls
]
ignore = [
    "PT018",  # several conditions in one assert keep test intent readable
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501", "T201"]
"app/seed_knowledge.py" = ["E501"]
"../evals/*.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true
